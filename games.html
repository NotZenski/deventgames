<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Games | Devent Games</title>
  <meta name="description" content="Every game made by Devent Games. Jump in and play on Roblox." />
  <meta name="theme-color" content="#0a0605" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-page="games">
  <header id="site-header"></header>

  <main>
    <section class="section section--games page-top">
      <div class="container">
        <div class="section__head section__head--row">
          <div>
            <span class="section__kicker">Our games</span>
            <h1 class="section__title">Live on Roblox right now.</h1>
          </div>
          <div class="segmented" id="sort" role="group" aria-label="Sort games">
            <button type="button" data-sort="playing" class="is-active">Most playing</button>
            <button type="button" data-sort="plays">Most visits</button>
            <button type="button" data-sort="newest">Newest</button>
          </div>
        </div>
        <div class="games__grid" id="game-grid"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="/layout.js"></script>
  <script src="/games.js"></script>
  <script src="/main.js"></script>
</body>
</html>
